name: Refresh Palworld breeding data

on:
  schedule:
    - cron: '0 6 * * 1'        # every Monday 06:00 UTC
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Rebuild data from palcalc
        run: python3 refresh_data.py
      - name: Commit if changed
        run: |
          git config user.name  "breeding-data-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "data: refresh from palcalc ($(date -u +%Y-%m-%d))"
            git push
            echo "Data updated."
          else
            echo "No changes — data already current."
          fi
